[/Script/Engine.RendererSettings]
; ===== CXMR — Forward MR rendering track (Docs/Varjo-Capabilities.md §10, §17) =====
r.ForwardShading=True
r.AllowStaticLighting=True
r.GenerateMeshDistanceFields=True
r.Shadow.Virtual.Enable=1
r.AntiAliasingMethod=3
vr.InstancedStereo=True
r.AllowOcclusionQueries=False
vr.RoundRobinOcclusion=False

; --- MR alpha compositing (passthrough shows where RGBA=0) ---
r.PostProcessing.PropagateAlpha=True
r.DefaultBackBufferPixelFormat=4

; --- Masking (Custom Depth-Stencil) ---
r.CustomDepth=1
r.CustomDepthTemporalAAJitter=True

; --- Post-process blacklist (QuadView / MR artefacts; AutoExposure off = no focus-area square) ---
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.Bloom=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.LensFlare=False
r.DefaultFeature.AmbientOcclusion=False
r.SeparateTranslucency=False

; --- Dropped from the blank Deferred/Lumen/Substrate defaults (incompatible with Forward MR) ---
r.RayTracing=False
r.SkinCache.CompileShaders=False

[SystemSettings]
; MR takes the sky dome out of the main pass on purpose (it keeps feeding the sky light), which trips the
; editor-only "YOUR SCENE CONTAINS A SKYDOME MESH ... DOES NOT COVER" text — drawn into the headset in VR Preview.
r.SkyAtmosphere.EditorNotifications=0

